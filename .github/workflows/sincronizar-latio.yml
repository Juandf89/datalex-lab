name: Sincronizar consola de LATIO

on:
  schedule:
    # Cada 6 horas, a :40 para no coincidir con SECOP (:00) ni con la Bitácora
    # (:20). Una corrida sin cambios no hace commit, así que no despierta un
    # despliegue. Para publicar un cambio ya mismo está el disparo manual.
    - cron: "40 */6 * * *"
  workflow_dispatch: {}

# MISMO grupo que los otros dos crones a propósito: los tres hacen commit y push
# a main, y `concurrency` es por repositorio, no por workflow. Compartir la
# cadena evita la carrera de `git push` entre corridas solapadas.
concurrency:
  group: actualizar-secop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # La fuente de la consola es Juandf89/TOOL-KIT-CIIVL (toolkit-api/index.html),
      # un repositorio público: no hace falta ningún secreto. El script valida lo
      # descargado y, si algo no cuadra, falla sin escribir nada: el sitio conserva
      # la consola que ya tenía.
      - name: Copiar la consola desde TOOL-KIT-CIIVL
        id: copiar
        run: bash scripts/sincronizar_consola_latio.sh

      # Mismo mecanismo de reintentos que los otros dos workflows. Solo se añade
      # latio/index.html: esta corrida nunca toca otra cosa.
      - name: Commit y push si hay cambios
        if: steps.copiar.outputs.cambio == '1'
        env:
          SHA_FUENTE: ${{ steps.copiar.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latio/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en la consola, nada que commitear."
            exit 0
          fi
          git commit -m "chore: sincronizar la consola de LATIO con TOOL-KIT-CIIVL@${SHA_FUENTE}"
          for intento in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $intento/5) — reintegrando sobre origin/main y reintentando"
            git pull --rebase origin main
            sleep $((intento * 5))
          done
          echo "::error::no se pudo pushear tras 5 intentos"
          exit 1
