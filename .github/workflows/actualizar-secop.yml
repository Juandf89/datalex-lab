name: Actualizar datos SECOP II

on:
  schedule:
    - cron: "0 6,18 * * *"  # 06:00 y 18:00 UTC = 01:00 y 13:00 Bogotá, cada 12h
  workflow_dispatch: {}   # permite disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar JSON de la API
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          OUTPUT_DIR: ./api/secop
        run: python scripts/generar_json.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/secop
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, nada que commitear."
          else
            git commit -m "chore: actualizar datos SECOP II ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
