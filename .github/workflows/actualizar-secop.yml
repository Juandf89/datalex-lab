name: Actualizar datos SECOP II

on:
  schedule:
    # Cada hora. Antes esto habría costado un deploy por corrida sin importar
    # si había datos nuevos (~10,800 créditos Netlify/mes, insostenible) —
    # ahora generar_json.py solo commitea cuando el acumulado realmente
    # cambió, así que el costo real depende de cuántas corridas encuentran
    # contratos nuevos, no de la frecuencia del cron en sí.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permite disparo manual desde la pestaña Actions

# Encontrado en producción (2026-08-06): sin esto, dos disparos manuales
# separados por segundos (o uno manual solapado con el programado) corrían en
# paralelo y competían por el mismo "git push" — una de las dos quedaba
# rechazada (no-fast-forward) y las siguientes se acumulaban en cola hasta
# quedar canceladas. Con `cancel-in-progress: false` la corrida nueva espera
# a que termine la anterior en vez de pisarla o competir por el push.
concurrency:
  group: actualizar-secop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r scripts/requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Recoge los contratos que la gente encontró en vivo (búsquedas que no
      # estaban en la muestra local, resueltas por server/app.mjs en Hostinger)
      # y los deja en scripts/pendientes_absorbidos.json para que Python los
      # fusione al histórico acumulado. Si API_BASE_URL/ABSORBER_TOKEN no están
      # configurados como secrets del repo, este paso no hace nada (ver
      # scripts/absorber_pendientes_secop.mjs) y el resto del pipeline sigue
      # funcionando exactamente igual que antes de este mecanismo — por eso
      # continue-on-error: no debe poder tumbar la ingesta normal. Sin paso de
      # "npm ci": el script usa fetch() nativo de Node, sin dependencias.
      - name: Recoger pendientes de búsquedas en vivo (SECOP)
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ABSORBER_TOKEN: ${{ secrets.ABSORBER_TOKEN }}
        run: node scripts/absorber_pendientes_secop.mjs fetch

      - name: Generar JSON de la API
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          OUTPUT_DIR: ./api/secop
          SECOP_MYSQL_HOST: ${{ secrets.SECOP_MYSQL_HOST }}
          SECOP_MYSQL_PORT: ${{ secrets.SECOP_MYSQL_PORT }}
          SECOP_MYSQL_USER: ${{ secrets.SECOP_MYSQL_USER }}
          SECOP_MYSQL_PASSWORD: ${{ secrets.SECOP_MYSQL_PASSWORD }}
          SECOP_MYSQL_DATABASE: ${{ secrets.SECOP_MYSQL_DATABASE }}
        run: python scripts/generar_json.py

      # Solo se confirma el borrado en el servidor de los pendientes que el
      # paso anterior sí pudo escribir en disco Y que Python sí terminó de
      # procesar — si
      # generar_json.py falla, este paso ni se ejecuta (comportamiento por
      # defecto de GitHub Actions) y esos contratos se reintentan en la
      # próxima corrida en vez de perderse.
      - name: Confirmar absorción de pendientes-secop
        if: success()
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ABSORBER_TOKEN: ${{ secrets.ABSORBER_TOKEN }}
        run: node scripts/absorber_pendientes_secop.mjs confirm

      # Encontrado en producción (2026-08-09): el `concurrency` de arriba solo serializa
      # corridas de ESTE workflow entre sí — no protege contra un push manual directo a
      # main (p.ej. un fix de código) que aterriza mientras el job ya hizo el checkout.
      # Ese día un push manual llegó a mitad de una corrida y el `git push` final se
      # rechazó (non-fast-forward), perdiendo la actualización de datos de esa hora.
      # Con reintentos: si el push falla, se reintegra el commit sobre el origin/main
      # más reciente con `reset --soft` (no rebase/merge) y se recommitea — como
      # api/secop/*.json es 100% output regenerado por este mismo job, no hay nada que
      # mezclar línea por línea: el archivo recién generado siempre gana sobre lo que
      # haya en el commit ajeno.
      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/secop
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, nada que commitear."
            exit 0
          fi
          for intento in 1 2 3 4 5; do
            git commit -m "chore: actualizar datos SECOP II ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $intento/5) — reintegrando sobre origin/main y reintentando"
            git fetch origin main
            git reset --soft origin/main
            sleep $((intento * 5))
          done
          echo "::error::no se pudo pushear tras 5 intentos"
          exit 1
