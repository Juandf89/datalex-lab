name: Actualizar grafo de jurisprudencia

on:
  schedule:
    - cron: "0 7 * * 1"  # 07:00 UTC cada lunes = 02:00 Bogotá — semanal, no cada 12h
  workflow_dispatch: {}   # permite disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements-jurisprudencia.txt

      - name: Generar grafo de jurisprudencia
        env:
          OUTPUT_DIR: ./api/jurisprudencia
        run: python scripts/generar_grafo_jurisprudencia.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/jurisprudencia
          if git diff --cached --quiet; then
            echo "Sin cambios en el grafo, nada que commitear."
          else
            git commit -m "chore: actualizar grafo de jurisprudencia ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
