[build]
  # El sitio (HTML/JSON) sigue sin build step -- este comando solo instala
  # las dependencias de las funciones (@netlify/blobs, cheerio) antes del
  # empaquetado. Verificado en el log real de un deploy: sin esto, "Functions
  # bundling" corria en 165ms (imposible si hubiera instalado algo) y las
  # funciones crasheaban en produccion con "Cannot find package '@netlify/blobs'".
  command = "npm install --prefix netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
